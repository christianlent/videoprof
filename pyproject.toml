[project]
name = "videoprof"
version = "0.4.0"
description = "Video Profiler - profile various attributes of local videos like resolution, codec, container, audio channels, and more!"
authors = [{ name = "Christian Lent", email = "christian@lent.us" }]
license = "MIT"
readme = "README.md"
keywords = ["videoprof", "video", "profile", "profiler", "mediainfo", "resolution", "codec", "container", "collection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Video",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
requires-python = ">=3.9"
dependencies = [
    "click>=8.1,<9",
    "colored>=2.2,<3",
    "platformdirs>=4.0,<5",
    "pymediainfo>=7.0.1,<8",
]

[project.scripts]
videoprof = "videoprof.videoprof:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "videoprof"
module-root = ""

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
namespace_packages = true
check_untyped_defs = true
files = ["videoprof/**/*.py"]

[[tool.mypy.overrides]]
module = ["pymediainfo.*"]
ignore_missing_imports = true
